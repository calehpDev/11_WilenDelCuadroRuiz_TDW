{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-3">Subir y Optimizar Imagen</h2>
  
  <form id="form-producto" method="POST" enctype="multipart/form-data" class="space-y-5">
    <div>
      <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-2">Nombre del Producto</label>
      <input type="text" id="nombre" name="nombre" required placeholder="Ej. Camiseta Deportiva" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
    </div>

    <div>
      <label for="imagen" class="block text-sm font-semibold text-gray-700 mb-2">Selecciona una imagen</label>
      <input type="file" id="imagen" name="imagen" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-md transition duration-200">
      Cargar y Optimizar
    </button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
